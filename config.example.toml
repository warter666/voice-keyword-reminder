# 实时语音关键词提醒 配置模板
# 复制本文件为 config.toml 后按需修改;config.toml 含个人敏感信息,已被 .gitignore 排除不入库
# 命令行参数优先级高于配置文件

# 监听的回环(系统声音)设备:推荐留空 "" 自动跟随系统默认播放设备
# 也可写名称片段如 "耳机"(按名字找,插拔不变)或编号(插拔后会变,不推荐)
# 用 `python reminder.py --list-devices` 查看设备名
#device = ""

# whisper 模型: tiny/base/small/medium,越大越准越慢
# 实测体积: small≈464MB、medium≈1.5GB(首次运行自动下载,国内可设 HF_ENDPOINT=https://hf-mirror.com)
model = "small"

# 关键词列表;繁体转写自动归一(「副店長」=「副店长」)
# 词尾加 * 启用拼音近音容错:「签到*」可命中「千道」(同音)和「先到」(声母 q/x 易混)
# 注意:容错越大误报越多(如「千岛湖」会命中「签到*」),只给确实需要的词加 *
keywords = ["签到*"]

# 同一关键词两次提醒的最小间隔(秒)
cooldown = 30

# 每次识别的音频窗长(秒)与步进(秒);步进小于窗口时窗口重叠,防止词被切断
window = 4.0
step = 2.0

# 全局拼音同音容错(对所有关键词生效);建议保持 false,按需给单个词加 *
pinyin = false

# 提醒方式
toast = true   # Windows 通知
beep = true    # 提示音

# 不打印每段识别文本(调试建议保持 false)
quiet = false

# ---- 手机推送(可选) ----
# 安卓: 装 ntfy App(https://ntfy.sh 或 F-Droid) → 订阅一个别人猜不到的主题(如 qd-xidian-8f3k)
#      把主题名填到 ntfy_topic,手机就会收到推送
# 微信: 关注 PushPlus 公众号拿到 token,填到 pushplus_token
# 两个都留空则只在本机弹窗+提示音
ntfy_topic = ""
pushplus_token = ""

# ---- 定时提醒(可选) ----
# 每天这些时刻推送「可能是签到时间」,应对听不清/没说话的情况
# 按你的课程规律填:开课时刻、开课约45分钟后、下课(或结束前10分钟)
#remind_times = ["08:00", "08:45", "09:30"]
