# 实时语音关键词提醒 配置文件
# 命令行参数优先级高于本文件;删掉本文件则全部使用默认值

# 监听的回环(系统声音)设备编号,用 `python reminder.py --list-devices` 查看
# 不填则自动跟随系统默认播放设备
device = 34

# whisper 模型: tiny/base/small/medium,越大越准越慢(首次运行自动下载)
model = "small"

# 关键词列表;繁体转写自动归一(「副店長」=「副店长」)
# 词尾加 * 表示启用拼音同音容错:如「副店长*」可命中误转写的「副典长」
# 注意:同音容错有误报风险(如「千岛湖」与「签到」同音),只给需要的词加 *
keywords = ["副店长*", "FDE", "签到"]

# 同一关键词两次提醒的最小间隔(秒)
cooldown = 30

# 每次识别的音频窗长(秒)与步进(秒);步进小于窗口时窗口重叠,防止词被切断
window = 4.0
step = 2.0

# 全局拼音同音容错(对所有关键词生效);建议保持 false,按需给单个词加 *
pinyin = false

# 提醒方式
toast = true   # Windows 通知
beep = true    # 提示音

# 不打印每段识别文本(调试建议保持 false)
quiet = false
